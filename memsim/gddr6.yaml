# gddr6.yaml - the benchmark GPU's memory (NVIDIA RTX 3070: 8 GB GDDR6, 8 x 8 Gb x32 chips = 16 channels x 16 bit at
# 14 Gb/s = 448 GB/s) as the Ramulator2 GDDR6 device model (memsim/hbm.py GDDR6), the DRAM of the unit instead of hbm2.yaml.
#   - timing: the Ramulator2 GDDR6 preset constants (GDDR6_2000_1350mV, in CK) at the real clock: CK 1.75 GHz (tCK 571 ps,
#     rate 3500 MT/s per CK edge pair; WCK 3.5 GHz, 14 Gb/s per pin). Spelled out because a preset pins tCK to 1 ns.
#     nRFC 210 CK = 120 ns, nREFI 3333 CK = 1.9 us (JEDEC GDDR6), nFAW 28 (x16). nCCDS 2 / nCCDL 3 (JEDEC GDDR6: tCCDS = 2 CK =
#     one BL16 burst, tCCDL ~1.7 ns; the preset's 4 / 6 go with its 8-CK burst and would cap a channel at half its bus rate).
#   - access: 32 B per RD / WR = BL16 x 16 bit = one value slot of our SRAM (org.channel_width 32 x the model's prefetch 8).
#     nBL 2: BL16 at 14 Gb/s occupies the 16-bit channel 1.14 ns = 2 CK -> 16 B per CK per channel = 28 GB/s, x16 = 448 GB/s.
#   - rows: 2 KB (512 columns x 32 B = the x16 GDDR6 page); 4 bank groups x 4 banks; channel and row set per run (memsim/hbm.py:
#     rows = 65536 / channels, so that the model's density check channels x banks x rows x 2 KB = 8 Gb = 1 GB holds; the trees
#     use < 32 MB).
#   - the unit's clock is 1 GHz: hbm.py ticks the model 7 times per 4 unit cycles (1.75 CK per cycle).
# Kept from the HBM2 config: GEM5 (external) frontend, Generic controller, FR-FCFS, all-bank refresh, RoBaRaCoCh mapping.
Frontend:
  impl: GEM5
  clock_ratio: 1

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  DRAM:
    impl: GDDR6
    org:
      preset: GDDR6_8Gb_x16
      channel: 16
      channel_width: 32
      bankgroup: 4
      bank: 4
      row: 4096
      column: 512
      density: 8192
    timing:
      rate: 3500
      nBL: 2
      nCL: 24
      nRCDRD: 26
      nRCDWD: 16
      nRP: 26
      nRAS: 53
      nRC: 79
      nWR: 26
      nRTP: 4
      nCWL: 6
      nCCDS: 2
      nCCDL: 3
      nRRDS: 7
      nRRDL: 7
      nWTRS: 9
      nWTRL: 11
      nFAW: 28
      nRFC: 210
      nRFCpb: 105
      nRREFD: 14
      nREFI: 3333

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: UnitreeCmdCount

  AddrMapper:
    impl: RoBaRaCoCh
