Frontend:
  impl: GEM5
  clock_ratio: 1

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  DRAM:
    impl: HBM2
    org:
      preset: HBM2_4Gb
      channel: 8
      channel_width: 128
    timing:
      preset: HBM2_2Gbps
      nBL: 2

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: UnitreeCmdCount

  AddrMapper:
    impl: RoBaRaCoCh
