# hbm2.yaml - our HBM for the co-simulation (memsim/hbm.py). UniZK's configs/*.yaml with three changes:
#   - Frontend: GEM5 (external requests; the unit simulator is the frontend) instead of their trace replayer TraceGen
#   - org.channel_width: 128, the HBM2 legacy channel: one RD / WR moves 2 (prefetch) x 128 bit = 32 B = one value slot of
#     our SRAM; 32 columns x 32 B = 1 KB rows, the row size the layouts in compile_tree.py assume
#   - channel: set per run (memsim/hbm.py passes MemorySystem.DRAM.org.channel=N); 8 channels = one HBM2 stack
# Kept from UniZK: HBM2_4Gb, HBM2_2Gbps (tCK 1 ns = the unit's 1 GHz clock, one memory tick per unit cycle), Generic
# controller, FR-FCFS, all-bank refresh, RoBaRaCoCh address mapping. Peak: 32 B per channel per cycle (32 GB/s at 1 GHz).
Frontend:
  impl: GEM5
  clock_ratio: 1

MemorySystem:
  impl: GenericDRAM
  clock_ratio: 1
  DRAM:
    impl: HBM2
    org:
      preset: HBM2_4Gb
      channel: 8
      channel_width: 128
    timing:
      preset: HBM2_2Gbps

  Controller:
    impl: Generic
    Scheduler:
      impl: FRFCFS
    RefreshManager:
      impl: AllBank
    plugins:
      - ControllerPlugin:
          impl: UnitreeCmdCount

  AddrMapper:
    impl: RoBaRaCoCh
